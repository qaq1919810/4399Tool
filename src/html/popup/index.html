<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>4399 多账号管家</title>
    <style>
        body { width: 360px; font-family: sans-serif; margin: 0; padding: 15px; background: #f5f7f9; }
        h2 { margin-top: 0; font-size: 18px; color: #333; }
        .btn-save { width: 100%; background: #ea4c89; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; }
        .btn-save:hover { background: #f082ac; }
        .btn-refresh-all { width: 100%; background: #9C27B0; color: white; border: none; padding: 10px; border-radius: 8px; font-size: 14px; cursor: pointer; margin-top: 8px; }
        .btn-refresh-all:hover { background: #7B1FA2; }
        .btn-refresh-all:disabled { background: #ccc; cursor: not-allowed; }
        .account-list { margin-top: 15px; display: flex; flex-direction: column; gap: 10px; }
        .account-card { background: white; padding: 10px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .avatar { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; border: 2px solid #eee; }
        .info { flex: 1; overflow: hidden; }
        .info h4 { margin: 0 0 4px 0; font-size: 15px; color: #333; display: flex; align-items: center; justify-content: space-between; }
        .info p { margin: 0; font-size: 12px; color: #666; word-wrap: break-word; overflow-wrap: break-word; }
        .badge-auth { background: #e8f5e9; color: #4caf50; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: normal;}
        .badge-unauth { background: #ffebee; color: #f44336; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: normal;}
        .btn-switch { background: #2196F3; color: white; border: none; padding: 6px 12px; border-radius: 4px; font-size: 12px; cursor: pointer; white-space: nowrap; }
        .btn-switch:hover { background: #1976D2; }
        .btn-switch:disabled { background: #ccc; cursor: not-allowed; }
        .btn-edit { background: #FF9800; color: white; border: none; padding: 6px 12px; border-radius: 4px; font-size: 12px; cursor: pointer; white-space: nowrap; }
        .btn-edit:hover { background: #F57C00; }
        .btn-refresh { background: #607D8B; color: white; border: none; padding: 6px 12px; border-radius: 4px; font-size: 12px; cursor: pointer; white-space: nowrap; }
        .btn-refresh:hover { background: #455A64; }
        .btn-refresh:disabled { background: #ccc; cursor: not-allowed; }
        .btn-group { display: flex; flex-direction: column; gap: 6px; }
        .edit-form { width: 100%; padding: 10px; margin-top: 10px; background: #f9f9f9; border-radius: 8px; box-sizing: border-box; }
        .edit-row { display: flex; align-items: center; margin-bottom: 8px; }
        .edit-row label { width: 50px; font-size: 12px; color: #666; flex-shrink: 0; }
        .edit-row input, .edit-row select { flex: 1; padding: 6px 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 12px; }
        .edit-row input::placeholder { color: #aaa; }
        .btn-save-edit { width: 100%; background: #4CAF50; color: white; border: none; padding: 8px; border-radius: 4px; font-size: 13px; cursor: pointer; margin-top: 4px; }
        .btn-save-edit:hover { background: #388E3C; }
        .btn-save-edit:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>
<h2>🎮 4399 账号管家</h2>
<button id="btn-save-current" class="btn-save">正在检测当前账号...</button>
<button id="btn-refresh-all" class="btn-refresh-all">全部刷新</button>
<div id="account-list" class="account-list">
</div>

<script type="module" src="index.js"></script>
</body>
</html>
